<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BenzaTracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <style>
    body { padding-top: 1.5rem; }
    .kpi-card { text-align: center; padding: 1rem; }
    .kpi-card .value { font-size: 1.5rem; font-weight: bold; }
    .kpi-card .label { font-size: 0.85rem; text-transform: uppercase; opacity: 0.7; }
    .table-container { overflow-x: auto; }
    .chart-img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="container">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded-3 mb-4 px-3">
      <a class="navbar-brand" href="/">BenzaTracker</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link" href="/entries">Rifornimenti</a>
        <a class="nav-link" href="/report">PDF</a>
      </div>
    </nav>

    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

# CI: installa dipendenze, linta e testa BenzaTracker
name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (tkinter + virtual display)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk tk-dev xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # ferma la build su errori di sintassi o nomi non definiti
          flake8 src/benzatracker tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # warning come informativi
          flake8 src/benzatracker tests --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Test with pytest (xvfb headless display)
        run: |
          xvfb-run --auto-servernum pytest --tb=short -v

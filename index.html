<!DOCTYPE html>
<html lang="it">
<head><script type='text/javascript' src='https://ppl-ai-code-interpreter-files.s3.amazonaws.com/Fcn_P6cCA6h0xqn6HXQYvAjrlNm2kuyrtK2v75C0CGMUfqIsgqn609L2gbL4DxZdYiSD_UVC5EE2UXerkEKbKX3357FyXoC-VxE94vfekrbJPDzv0zmL9H9K4KyqcWvJnREogJlvLuRdJK-NIQedM3JiDTSQGgfSfXYgx_YdMtg='></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Tracker - Traccia Consumo Benzina</title>
    <style>
        :root {
            --color-primary: #2180a3;
            --color-primary-hover: #1a6482;
            --color-bg: #f5f5f5;
            --color-surface: #ffffff;
            --color-text: #1f2121;
            --color-text-secondary: #626c7c;
            --color-border: #d4d4d4;
            --color-success: #21c88a;
            --color-warning: #f59c3c;
            --color-error: #ff5459;
            --color-gray: #e0e0e0;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: var(--color-surface);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--color-primary);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--color-text-secondary);
            font-size: 14px;
        }

        .form-section {
            background: var(--color-surface);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            font-size: 14px;
            font-family: inherit;
        }

        input[type="number"]:focus,
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(33, 128, 163, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--color-primary);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--color-primary-hover);
        }

        .btn-secondary {
            background: var(--color-gray);
            color: var(--color-text);
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-secondary:hover {
            background: #d4d4d4;
        }

        .btn-danger {
            background: var(--color-error);
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-danger:hover {
            background: #ff3a41;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--color-surface);
            border-radius: var(--radius);
            padding: 15px;
            box-shadow: var(--shadow);
            border-top: 3px solid var(--color-primary);
        }

        .stat-label {
            color: var(--color-text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-primary);
        }

        .stat-unit {
            font-size: 12px;
            color: var(--color-text-secondary);
            margin-left: 4px;
        }

        .list-section {
            background: var(--color-surface);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .list-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            margin-bottom: 10px;
        }

        .item-info {
            flex: 1;
        }

        .item-date {
            font-size: 12px;
            color: var(--color-text-secondary);
        }

        .item-main {
            font-weight: 600;
            margin: 4px 0;
        }

        .item-meta {
            font-size: 13px;
            color: var(--color-text-secondary);
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--color-text-secondary);
        }

        .empty-state p {
            margin: 0;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--color-border);
        }

        .tab {
            padding: 12px 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 500;
            color: var(--color-text-secondary);
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: var(--color-primary);
            border-bottom-color: var(--color-primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 20px 0 15px 0;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⛽ Fuel Tracker</h1>
            <p class="subtitle">Traccia i consumi di carburante della tua auto e monitora il risparmio</p>
        </header>

        <!-- STATISTICS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Consumo Medio</div>
                <div class="stat-value" id="avgConsumption">-<span class="stat-unit">L/100km</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Efficienza</div>
                <div class="stat-value" id="avgEfficiency">-<span class="stat-unit">km/L</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Rifornimenti</div>
                <div class="stat-value" id="totalRefuels">0<span class="stat-unit">x</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Spesa Totale</div>
                <div class="stat-value" id="totalSpent">0<span class="stat-unit">€</span></div>
            </div>
        </div>

        <!-- FORM SECTION -->
        <div class="form-section">
            <div class="tabs">
                <button class="tab active" onclick="switchTab(0)">Aggiungi Rifornimento</button>
                <button class="tab" onclick="switchTab(1)">Impostazioni</button>
            </div>

            <!-- TAB 1: ADD REFUEL -->
            <div class="tab-content active">
                <div class="form-group">
                    <label for="refuelDate">Data Rifornimento:</label>
                    <input type="date" id="refuelDate">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="kilometers">Chilometri (km):</label>
                        <input type="number" id="kilometers" placeholder="Es. 42500" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="liters">Litri Riforniti:</label>
                        <input type="number" id="liters" placeholder="Es. 45.5" step="0.01">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="pricePerLiter">Prezzo al Litro (€):</label>
                        <input type="number" id="pricePerLiter" placeholder="Es. 1.75" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="totalCost">Costo Totale (€):</label>
                        <input type="number" id="totalCost" placeholder="Calcolato automaticamente" step="0.01" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Note (opzionale):</label>
                    <input type="text" id="notes" placeholder="Es. Percorso autostradale">
                </div>

                <button class="btn-primary" onclick="addRefuel()">Aggiungi Rifornimento</button>
            </div>

            <!-- TAB 2: SETTINGS -->
            <div class="tab-content">
                <div class="form-group">
                    <label for="vehicleName">Nome Veicolo:</label>
                    <input type="text" id="vehicleName" placeholder="Es. Fiat 500">
                </div>

                <div class="form-group">
                    <label for="vehicleModel">Modello/Targa:</label>
                    <input type="text" id="vehicleModel" placeholder="Es. DK123AB">
                </div>

                <div class="form-group">
                    <label for="googleScriptUrl">Google Apps Script URL:</label>
                    <input type="text" id="googleScriptUrl" placeholder="https://script.google.com/macros/s/...">
                    <small style="color: var(--color-text-secondary); margin-top: 4px; display: block;">Incolla l'URL dalla tua Google Apps Script (salva su Google Sheets)</small>
                </div>

                <div class="form-group">
                    <button class="btn-secondary" onclick="testConnection()" style="width: 100%;">🔗 Testa Connessione</button>
                </div>

                <div class="form-group">
                    <button class="btn-secondary" onclick="exportData()" style="width: 100%;">📥 Scarica Dati (CSV)</button>
                </div>

                <div class="form-group">
                    <button class="btn-danger" onclick="clearAllData()" style="width: 100%;">🗑️ Cancella Tutti i Dati</button>
                </div>
            </div>
        </div>

        <!-- REFUEL LIST -->
        <div class="list-section">
            <h2>📋 Storico Rifornimenti</h2>
            <div id="refuelList"></div>
        </div>
    </div>

    <script>
        // Constants
        const STORAGE_KEY = 'fuelTrackerData';
        const DEFAULT_VEHICLE = 'La mia auto';

        // Initialize
        function init() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('refuelDate').value = today;
            loadData();
            updateStats();
            updateRefuelList();
        }

        // Tab switching
        function switchTab(index) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.tab-content').forEach((c, i) => {
                c.classList.toggle('active', i === index);
            });
        }

        // Auto-calculate total cost
        document.getElementById('liters').addEventListener('input', calculateTotalCost);
        document.getElementById('pricePerLiter').addEventListener('input', calculateTotalCost);

        function calculateTotalCost() {
            const liters = parseFloat(document.getElementById('liters').value) || 0;
            const price = parseFloat(document.getElementById('pricePerLiter').value) || 0;
            const total = (liters * price).toFixed(2);
            document.getElementById('totalCost').value = total;
        }

        // Add refuel entry
        function addRefuel() {
            const date = document.getElementById('refuelDate').value;
            const km = parseFloat(document.getElementById('kilometers').value);
            const liters = parseFloat(document.getElementById('liters').value);
            const pricePerLiter = parseFloat(document.getElementById('pricePerLiter').value);
            const notes = document.getElementById('notes').value;

            if (!date || !km || !liters || !pricePerLiter) {
                alert('Per favore, compila tutti i campi obbligatori');
                return;
            }

            const data = getData();
            const entry = {
                id: Date.now(),
                date: date,
                kilometers: km,
                liters: liters,
                pricePerLiter: pricePerLiter,
                totalCost: (liters * pricePerLiter).toFixed(2),
                notes: notes
            };

            data.refuels.push(entry);
            saveData(data);
            
            // Send to Google Sheets
            sendToGoogleSheets(entry);
            
            // Clear form
            document.getElementById('kilometers').value = '';
            document.getElementById('liters').value = '';
            document.getElementById('pricePerLiter').value = '';
            document.getElementById('totalCost').value = '';
            document.getElementById('notes').value = '';

            updateStats();
            updateRefuelList();
        }

        // Calculate statistics
        function updateStats() {
            const data = getData();
            const refuels = data.refuels.sort((a, b) => new Date(a.date) - new Date(b.date));

            let avgConsumption = '-';
            let avgEfficiency = '-';
            let totalSpent = 0;

            if (refuels.length >= 2) {
                const first = refuels[0];
                const last = refuels[refuels.length - 1];
                const kmDiff = last.kilometers - first.kilometers;
                let totalLiters = 0;

                refuels.forEach((r, i) => {
                    if (i > 0) totalLiters += r.liters;
                });

                if (kmDiff > 0 && totalLiters > 0) {
                    const consumption = ((totalLiters / kmDiff) * 100).toFixed(2);
                    const efficiency = (kmDiff / totalLiters).toFixed(2);
                    avgConsumption = consumption;
                    avgEfficiency = efficiency;
                }
            }

            refuels.forEach(r => {
                totalSpent += parseFloat(r.totalCost);
            });

            document.getElementById('avgConsumption').innerHTML = 
                `${avgConsumption}<span class="stat-unit">L/100km</span>`;
            document.getElementById('avgEfficiency').innerHTML = 
                `${avgEfficiency}<span class="stat-unit">km/L</span>`;
            document.getElementById('totalRefuels').innerHTML = 
                `${refuels.length}<span class="stat-unit">x</span>`;
            document.getElementById('totalSpent').innerHTML = 
                `${totalSpent.toFixed(2)}<span class="stat-unit">€</span>`;
        }

        // Update refuel list
        function updateRefuelList() {
            const data = getData();
            const refuels = data.refuels.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (refuels.length === 0) {
                document.getElementById('refuelList').innerHTML = 
                    '<div class="empty-state"><p>Nessun rifornimento registrato.<br>Aggiungi il primo rifornimento per iniziare!</p></div>';
                return;
            }

            let html = '';
            refuels.forEach((r, i) => {
                let consumption = '-';
                if (i < refuels.length - 1) {
                    const prevKm = refuels[i + 1].kilometers;
                    const kmDiff = r.kilometers - prevKm;
                    if (kmDiff > 0) {
                        consumption = ((r.liters / kmDiff) * 100).toFixed(2) + ' L/100km';
                    }
                }

                html += `
                    <div class="list-item">
                        <div class="item-info">
                            <div class="item-date">${new Date(r.date).toLocaleDateString('it-IT')}</div>
                            <div class="item-main">${r.liters.toFixed(2)} L @ ${r.pricePerLiter.toFixed(2)}€/L = ${r.totalCost}€</div>
                            <div class="item-meta">
                                🚗 ${r.kilometers} km | ⚡ ${consumption}
                                ${r.notes ? `| 📝 ${r.notes}` : ''}
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="btn-danger" onclick="deleteRefuel(${r.id})">×</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('refuelList').innerHTML = html;
        }

        // Delete refuel
        function deleteRefuel(id) {
            if (confirm('Sei sicuro di voler eliminare questo rifornimento?')) {
                let data = getData();
                data.refuels = data.refuels.filter(r => r.id !== id);
                saveData(data);
                updateStats();
                updateRefuelList();
            }
        }

        // Data management
        function getData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : { refuels: [], vehicle: DEFAULT_VEHICLE };
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function loadData() {
            const data = getData();
            document.getElementById('vehicleName').value = data.vehicle || '';
            document.getElementById('googleScriptUrl').value = data.googleScriptUrl || '';
        }

        document.getElementById('vehicleName').addEventListener('change', () => {
            let data = getData();
            data.vehicle = document.getElementById('vehicleName').value || DEFAULT_VEHICLE;
            saveData(data);
        });

        document.getElementById('googleScriptUrl').addEventListener('change', () => {
            let data = getData();
            data.googleScriptUrl = document.getElementById('googleScriptUrl').value;
            saveData(data);
        });

        // Google Sheets Integration
        function sendToGoogleSheets(entry) {
            const data = getData();
            const url = data.googleScriptUrl;

            if (!url) {
                console.log('URL di Google Apps Script non configurato');
                return;
            }

            const payload = {
                date: entry.date,
                kilometers: entry.kilometers,
                liters: entry.liters,
                pricePerLiter: entry.pricePerLiter,
                totalCost: entry.totalCost,
                notes: entry.notes
            };

            fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                body: new URLSearchParams(payload)
            })
            .then(() => {
                console.log('Dati salvati su Google Sheets!');
            })
            .catch(error => console.error('Errore:', error));
        }

        function testConnection() {
            const url = document.getElementById('googleScriptUrl').value;
            
            if (!url) {
                alert('⚠️ Per favore, incolla l\'URL di Google Apps Script nella sezione Impostazioni');
                return;
            }

            const testPayload = {
                date: new Date().toISOString().split('T')[0],
                kilometers: 0,
                liters: 0,
                pricePerLiter: 0,
                totalCost: 0,
                notes: 'TEST'
            };

            fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                body: new URLSearchParams(testPayload)
            })
            .then(() => {
                alert('✅ Connessione riuscita! I tuoi dati verranno salvati su Google Sheets');
                let data = getData();
                data.googleScriptUrl = url;
                saveData(data);
            })
            .catch(error => {
                alert('❌ Errore nella connessione. Verifica l\'URL');
                console.error('Errore:', error);
            });
        }

        // Export as CSV
        function exportData() {
            const data = getData();
            const refuels = data.refuels;

            if (refuels.length === 0) {
                alert('Nessun dato da esportare');
                return;
            }

            let csv = 'Data,Chilometri,Litri,Prezzo/L,Costo Totale,Note\n';
            refuels.forEach(r => {
                csv += `"${r.date}","${r.kilometers}","${r.liters}","${r.pricePerLiter}","${r.totalCost}","${r.notes}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `fuel-tracker-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        // Clear all data
        function clearAllData() {
            if (confirm('⚠️ ATTENZIONE: Sei sicuro? Questo cancellerà TUTTI i dati e non è reversibile.')) {
                if (confirm('Ultimo avviso: confermi di voler cancellare tutti i dati?')) {
                    localStorage.removeItem(STORAGE_KEY);
                    location.reload();
                }
            }
        }

        // Start
        init();
    </script>
</body>
</html>

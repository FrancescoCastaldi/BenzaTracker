[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "benzatracker"
version = "2.0.0"
description = "Desktop, CLI & Web app to track fuel refuels and compute spending KPIs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "ttkbootstrap>=1.10",
    "reportlab>=4.0.0",
    "flask>=3.0",
]

[project.urls]
Homepage = "https://github.com/FrancescoCastaldi/BenzaTracker"
Repository = "https://github.com/FrancescoCastaldi/BenzaTracker"
"Bug Tracker" = "https://github.com/FrancescoCastaldi/BenzaTracker/issues"
Changelog = "https://github.com/FrancescoCastaldi/BenzaTracker/blob/main/CHANGELOG.md"
Documentation = "https://github.com/FrancescoCastaldi/BenzaTracker/blob/main/README.md"

[project.scripts]
benzatracker = "benzatracker.cli:run"
benzatracker-gui = "benzatracker.gui:run"
benzatracker-web = "benzatracker.web:run"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
